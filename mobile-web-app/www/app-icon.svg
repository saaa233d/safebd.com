<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0d090d"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <!-- Burgundy to Crimson Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#580210"/>
    </linearGradient>
    <!-- Inner Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Solid Obsidian Dark Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Shield Wireframe Group -->
  <g transform="translate(256, 195) scale(0.72)" filter="url(#glow)">
    <!-- Outer Shield Contour -->
    <path d="M 0,260 C -140,180 -210,40 -210,-110 L -210,-145 C -100,-155 0,-225 0,-225 C 0,-225 100,-155 210,-145 L 210,-110 C 210,40 140,180 0,260 Z"
          fill="none" stroke="url(#shieldGrad)" stroke-width="17" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Inner Shield Contour -->
    <path d="M 0,215 C -115,150 -170,30 -170,-90 L -170,-120 C -80,-130 0,-185 0,-185 C 0,-185 80,-130 170,-120 L 170,-90 C 170,30 115,150 0,215 Z"
          fill="none" stroke="#880521" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Center Spine Divider Line -->
    <line x1="0" y1="-185" x2="0" y2="215" stroke="#b91c1c" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- 'SAFE' Text Below the Shield -->
  <text x="256" y="425"
        text-anchor="middle"
        dominant-baseline="central"
        fill="#ffffff"
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="46"
        font-weight="800"
        letter-spacing="14">SAFE</text>
</svg>
