<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SAFE Icon Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;">
  <canvas id="appCanvas" width="1024" height="1024" style="width: 512px; height: 512px; border-radius: 64px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);"></canvas>
  
  <script>
    const canvas = document.getElementById('appCanvas');
    const ctx = canvas.getContext('2d');

    // 1. Solid obsidian dark background
    ctx.fillStyle = '#050507';
    ctx.fillRect(0, 0, 1024, 1024);

    // 2. Draw the exact shield vector geometry matching the user's design
    function drawShield() {
      ctx.save();
      ctx.translate(512, 420); // Center above the SAFE text
      const scale = 1.35;
      ctx.scale(scale, scale);

      // Outer Shield Wireframe
      ctx.beginPath();
      ctx.moveTo(0, 260); // Bottom tip
      ctx.bezierCurveTo(-140, 180, -210, 40, -210, -110);
      ctx.lineTo(-210, -145);
      ctx.bezierCurveTo(-100, -155, 0, -225, 0, -225);
      ctx.bezierCurveTo(0, -225, 100, -155, 210, -145);
      ctx.lineTo(210, -110);
      ctx.bezierCurveTo(210, 40, 140, 180, 0, 260);
      ctx.closePath();

      ctx.lineWidth = 15;
      const grad = ctx.createLinearGradient(0, -225, 0, 260);
      grad.addColorStop(0, '#c62828'); // Cardinal crimson
      grad.addColorStop(1, '#6b0317'); // Deep burgundy wine
      ctx.strokeStyle = grad;
      ctx.lineJoin = 'round';
      ctx.stroke();

      // Inner Shield Wireframe
      ctx.beginPath();
      ctx.moveTo(0, 215);
      ctx.bezierCurveTo(-115, 150, -170, 30, -170, -90);
      ctx.lineTo(-170, -120);
      ctx.bezierCurveTo(-80, -130, 0, -185, 0, -185);
      ctx.bezierCurveTo(0, -185, 80, -130, 170, -120);
      ctx.lineTo(170, -90);
      ctx.bezierCurveTo(170, 30, 115, 150, 0, 215);
      ctx.closePath();

      ctx.lineWidth = 14;
      ctx.strokeStyle = '#8b0521';
      ctx.stroke();

      // Center Vertical Spine Line
      ctx.beginPath();
      ctx.moveTo(0, -185);
      ctx.lineTo(0, 215);
      ctx.lineWidth = 13;
      ctx.strokeStyle = '#a80c2e';
      ctx.stroke();

      ctx.restore();

      // 3. Draw Crisp Bold 'SAFE' Typography Below the Shield
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 88px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.letterSpacing = '18px';
      ctx.fillText('SAFE', 520, 855);
    }

    document.fonts.ready.then(() => {
      drawShield();
    });
  </script>
</body>
</html>
